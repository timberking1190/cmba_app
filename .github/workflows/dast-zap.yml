name: DAST (OWASP ZAP baseline)

# Interim dynamic scan against a running deploy (a Vercel preview or production).
# Manual only: it needs a reachable URL, which CI does not stand up. Provide the
# target when you run it. This is an advisory scan, not a merge gate; the
# independent penetration test remains the real assurance (docs/PENTEST_READINESS.md).
#
# How to run: Actions tab -> DAST (OWASP ZAP baseline) -> Run workflow -> paste the
# preview URL. Run the FIRST scan with CSP_REPORT_ONLY=true on the target so nothing
# is blocked while you confirm the pages render, then re-scan enforcing.

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Full URL to scan (e.g. https://cmba-preview.vercel.app)'
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline:
    name: ZAP baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ inputs.target_url }}
          rules_file_name: .zap/rules.tsv
          # Passive baseline crawl; do not fail the run (advisory, interim).
          cmd_options: '-a'
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report
