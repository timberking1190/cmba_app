version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Wait before proposing a newly published version. A freshly published package
    # can be malicious or simply broken, and the compromises that matter are
    # usually caught within days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk patch/minor bumps so review stays manageable.
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
